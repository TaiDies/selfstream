name: selfstream
description: Self-hosted music player for selfstream / Navidrome.
publish_to: "none"
version: 0.3.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  home_widget: ^0.7.0
  crypto: ^3.0.6
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  in_app_update: ^4.2.3
  connectivity_plus: ^6.1.0
  flutter_cache_manager: ^3.4.1
  ffi: ^2.1.3
  window_manager: ^0.5.1
  hotkey_manager: ^0.2.3
  local_notifier: ^0.1.6
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  android_intent_plus: ^5.2.0
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  windows_taskbar: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.16.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/taskbar/
