name: windows exe

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "website/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true
      - name: Generate the Windows project
        run: flutter create --org dev.selfstream --project-name selfstream --platforms windows .
      - name: App icon
        run: cp installer/app_icon.ico windows/runner/resources/app_icon.ico
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos 2>&1 | tee win-analyze.log
      - name: Build
        run: set -o pipefail; flutter build windows --release --dart-define=BUILD_NUMBER=${{ github.run_number }} 2>&1 | tee win-build.log
      - name: Zip
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/selfstream-windows.zip" ./*
      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$VERSION.${{ github.run_number }}" "//DSourceDir=$(cygpath -w "$PWD/build/windows/x64/runner/Release")" installer/selfstream.iss
          mv dist/selfstream-setup.exe "$GITHUB_WORKSPACE/selfstream-setup.exe"
      - name: Microsoft Store package (MSIX)
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: |
          if [ -z "$MSIX_IDENTITY_NAME" ] || [ -z "$MSIX_PUBLISHER" ] || [ -z "$MSIX_PUBLISHER_NAME" ]; then
            echo "Partner Center values not set (repo variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_NAME); skipping the MSIX."
            exit 0
          fi
          # The Store package is its own build: a plain Subsonic / Navidrome player, without selfstream's server extensions.
          set -o pipefail
          flutter build windows --release --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=STORE_BUILD=true 2>&1 | tee win-store-build.log
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          dart run msix:create --store --build-windows false \
            --display-name Selfstream --identity-name "$MSIX_IDENTITY_NAME" \
            --publisher "$MSIX_PUBLISHER" --publisher-display-name "$MSIX_PUBLISHER_NAME" \
            --version "${VERSION%.*}.${{ github.run_number }}.0" --logo-path assets/logo.png \
            --capabilities internetClient,privateNetworkClientServer --output-name selfstream-store 2>&1 | tee win-msix.log
          find build -name 'selfstream-store.msix' -exec cp {} "$GITHUB_WORKSPACE/selfstream-store.msix" \;
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          gh release delete windows-latest --yes --cleanup-tag 2>/dev/null || true
          ASSETS="selfstream-setup.exe selfstream-windows.zip"
          [ -f selfstream-store.msix ] && ASSETS="$ASSETS selfstream-store.msix"
          gh release create windows-latest $ASSETS --prerelease \
            --title "Selfstream for Windows $VERSION" \
            --notes "$(printf 'Run selfstream-setup.exe to install. The app checks for newer builds when it starts and offers to update.\nThe zip is a portable copy (no automatic updates).\n\nBuild: %s\nBuilt from %s.' "${{ github.run_number }}" "$GITHUB_SHA")"
      - name: Keep the log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/logs && cp win-*.log /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs && git init -q && git checkout -q -b windows-logs
          git -c user.name=ci -c user.email=ci@example.com add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "windows log" || exit 0
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" windows-logs
