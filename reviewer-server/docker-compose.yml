# Alternative to install-demo-server.sh: a plain Navidrome with the demo library, in Docker.
#   docker compose up -d
#   bash create-users.sh http://localhost:4533 CHOOSE_AN_ADMIN_PASSWORD reviewer CHOOSE_A_REVIEWER_PASSWORD
services:
  navidrome:
    image: deluan/navidrome:latest
    ports:
      - "4533:4533"
    environment:
      ND_ENABLEUSEREDITING: "false"
    volumes:
      - ./demo-music:/music:ro
      - ./data:/data
    restart: unless-stopped
